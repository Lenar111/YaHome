name: build

on:
  push:
    branches: [main]
  pull_request:
  
permissions:
  contents: read
  
jobs:
  typecheck:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Проверка типов (компиляция без линковки)
        run: tools/build.sh --typecheck
      - name: Полная сборка
        run: tools/build.sh build/YaHome
      - name: Установщик собирается
        run: python3 tools/make_installer.py
